name: Kurse aktualisieren

on:
  schedule:
    # Mo–Fr alle 15 Minuten von 07:00 bis 22:00 UTC (Börsenzeiten Europa + USA)
    - cron: '*/15 7-21 * * 1-5'
  workflow_dispatch: {}     # manuell starten: Actions → "Kurse aktualisieren" → Run workflow
  push:
    paths: ['stocks.json']  # sofort neu laden, wenn die Liste geändert wird

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-prices.mjs
      - name: Commit prices.json
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Kurse $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q || true
          git push
