<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aktien-Übersicht · 10 %-Regel</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --text:#e8eaef; --muted:#8b93a3;
    --green:#22c55e; --red:#ef4444; --yellow:#eab308; --blue:#3b82f6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 80px}
  header{padding:18px 16px 8px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px}
  .wrap{max-width:760px;margin:0 auto;padding:0 12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  button,select,input{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  button{cursor:pointer}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  button.small{padding:6px 10px;font-size:13px}
  button.ghost{background:transparent}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .tile b{display:block;font-size:22px}
  .tile span{color:var(--muted);font-size:12px}
  .tile.buy b{color:var(--green)} .tile.sell b{color:var(--red)} .tile.watch b{color:var(--yellow)}
  .card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .card.buy{border-left-color:var(--green)} .card.sell{border-left-color:var(--red)} .card.watch{border-left-color:var(--yellow)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-weight:700;font-size:16px}
  .ticker{color:var(--muted);font-size:12px}
  .price{font-size:18px;font-weight:700;text-align:right}
  .pct{font-weight:700}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--text);font-weight:600}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.3px}
  .badge.buy{background:rgba(34,197,94,.15);color:var(--green)}
  .badge.sell{background:rgba(239,68,68,.15);color:var(--red)}
  .badge.watch{background:rgba(234,179,8,.15);color:var(--yellow)}
  .badge.hold{background:#262a33;color:var(--muted)}
  .meter{position:relative;height:8px;background:#262a33;border-radius:99px;margin:10px 0 4px;overflow:hidden}
  .meter .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--muted);opacity:.5}
  .meter .fill{position:absolute;top:0;bottom:0;border-radius:99px}
  .meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .hint{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:12px}
  .hint b{color:var(--text)}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,440px)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  dialog input,dialog select,dialog textarea{width:100%}
  textarea{font:13px monospace;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:120px}
  .dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .status{font-size:12px;color:var(--muted);margin-top:4px}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
  .filter.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .warn{color:var(--yellow);font-size:12px;margin-top:6px}
  .log{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
</style>
</head>
<body>
<header class="wrap">
  <h1>📊 Aktien-Übersicht</h1>
  <div class="sub">Antizyklisch: <b id="ruleLabel">±10 %</b> seit letztem Kauf/Verkauf → handeln</div>
</header>

<main class="wrap">
  <div class="summary">
    <div class="tile buy"><b id="cntBuy">0</b><span>Kaufen</span></div>
    <div class="tile sell"><b id="cntSell">0</b><span>Verkaufen</span></div>
    <div class="tile watch"><b id="cntWatch">0</b><span>Beobachten</span></div>
  </div>

  <div class="bar">
    <button class="primary" id="btnRefresh">↻ Kurse laden</button>
    <button id="btnAdd">＋ Aktie</button>
    <select id="sortSel" title="Sortierung">
      <option value="signal">Sortiert: Signal</option>
      <option value="change">Sortiert: % seit Referenz</option>
      <option value="day">Sortiert: % heute</option>
      <option value="name">Sortiert: Name</option>
    </select>
    <button id="btnSettings">⚙︎</button>
  </div>
  <input id="search" type="search" placeholder="🔍 Suchen …" style="width:100%;margin-bottom:6px">
  <div class="bar" style="margin:4px 0 8px">
    <button class="small filter" data-f="all">Alle</button>
    <button class="small filter" data-f="buy">🟢 Kaufen</button>
    <button class="small filter" data-f="sell">🔴 Verkaufen</button>
    <button class="small filter" data-f="watch">🟡 Beobachten</button>
  </div>
  <div class="status" id="status"></div>

  <div class="hint" id="hint"></div>

  <div id="list"></div>
</main>

<!-- Aktie hinzufügen/bearbeiten -->
<dialog id="dlgStock">
  <h2 id="dlgTitle">Aktie</h2>
  <label>Name</label>
  <input id="fName" placeholder="z. B. Apple">
  <label>Yahoo-Ticker (z. B. AAPL, SAP.DE, 7203.T)</label>
  <input id="fTicker" placeholder="AAPL" autocapitalize="characters">
  <label>Referenzkurs in € (dein letzter Kauf/Verkauf)</label>
  <input id="fRef" type="number" step="0.01" inputmode="decimal">
  <label>Aktueller Kurs in € (nur nötig ohne Ticker)</label>
  <input id="fCur" type="number" step="0.01" inputmode="decimal">
  <label>Eigene Schwelle in % (leer = Standard)</label>
  <input id="fThr" type="number" step="0.5" inputmode="decimal" placeholder="z. B. 20 für sehr volatile Werte">
  <label>Notiz</label>
  <input id="fNote" placeholder="z. B. 5 Stück gehalten">
  <div class="dlg-actions">
    <button class="ghost" id="btnDelete" style="margin-right:auto;color:var(--red)">Löschen</button>
    <button class="ghost" data-close>Abbrechen</button>
    <button class="primary" id="btnSave">Speichern</button>
  </div>
</dialog>

<!-- Einstellungen -->
<dialog id="dlgSettings">
  <h2>Einstellungen</h2>
  <label>Handels-Schwelle (Kaufen/Verkaufen)</label>
  <select id="sThreshold">
    <option value="5">±5 %</option>
    <option value="7.5">±7,5 %</option>
    <option value="10">±10 %</option>
    <option value="15">±15 %</option>
  </select>
  <label>Frühwarnung „Beobachten“ ab</label>
  <select id="sWatch">
    <option value="3">±3 %</option>
    <option value="5">±5 %</option>
    <option value="7.5">±7,5 %</option>
  </select>
  <label>Liste exportieren / importieren (JSON)</label>
  <textarea id="sJson"></textarea>
  <div class="dlg-actions">
    <button class="ghost" id="btnImport">Importieren</button>
    <button class="ghost" id="btnReset" style="color:var(--red)">Liste zurücksetzen</button>
    <button class="ghost" data-close>Schließen</button>
    <button class="primary" id="btnSaveSettings">Speichern</button>
  </div>
</dialog>

<script>
const STORE = 'aktien-uebersicht-v2';
function uid(){ return Math.random().toString(36).slice(2,9); }

let state = null;
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

async function defaultList(){
  try{
    const r = await fetch('stocks.json?t='+Date.now());
    const arr = await r.json();
    return arr.map(s=>({id:uid(), name:s.name, ticker:s.ticker||'', ref:s.ref, cur:s.ref, day:s.day, thr:null, note:'', log:[]}));
  }catch(e){ return []; }
}
async function init(){
  try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && Array.isArray(s.stocks)) state = s; }catch(e){}
  if(!state){ state = {threshold:10, watch:5, updated:null, stocks: await defaultList()}; save(); }
  render();
  refresh(true);
}

const $ = id => document.getElementById(id);
const fmt = n => n==null||isNaN(n) ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits: n<1?3:2});
const fmtPct = n => n==null||isNaN(n) ? '–' : (n>0?'+':'')+n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';
const cls = n => n==null||isNaN(n) ? 'flat' : n>0?'up':n<0?'down':'flat';
const pctTxt = n => String(n).replace('.',',');
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const thrOf = s => s.thr || state.threshold;
function change(s){
  if(s.ref==null || s.cur==null || !s.ref) return null;
  return (s.cur - s.ref) / s.ref * 100;
}
function signal(s){
  const c = change(s), T = thrOf(s);
  if(c==null) return {key:'hold', label:'Referenz fehlt', rank:4};
  if(c <= -T) return {key:'buy',  label:'KAUFEN 🟢', rank:0};
  if(c >=  T) return {key:'sell', label:'VERKAUFEN 🔴', rank:1};
  if(Math.abs(c) >= Math.min(state.watch, T*0.75)) return {key:'watch', label:c<0?'Beobachten ↓':'Beobachten ↑', rank:2};
  return {key:'hold', label:'Halten', rank:3};
}

let filter = 'all';
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; render(); });
$('search').oninput = render;

function render(){
  document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('on', b.dataset.f===filter));
  $('ruleLabel').textContent = '±'+pctTxt(state.threshold)+' %';
  $('hint').innerHTML =
    `<b>So funktioniert's:</b> Der <b>Referenzkurs</b> ist dein letzter Kauf- oder Verkaufskurs (Start: Kurs vom 24.11.). `+
    `Fällt die Aktie davon um <b>${pctTxt(state.threshold)} %</b> → <span class="up">nachkaufen</span>, `+
    `steigt sie um ${pctTxt(state.threshold)} % → <span class="down">Teil verkaufen</span>. `+
    `Nach dem Trade „Gekauft“/„Verkauft“ tippen – dann zählt der neue Kurs als Referenz.`;

  const q = $('search').value.trim().toLowerCase();
  const sort = $('sortSel').value;
  let nb=0, ns=0, nw=0;
  state.stocks.forEach(s=>{ const k=signal(s).key; if(k==='buy')nb++; if(k==='sell')ns++; if(k==='watch')nw++; });
  $('cntBuy').textContent=nb; $('cntSell').textContent=ns; $('cntWatch').textContent=nw;

  const arr = state.stocks.filter(s=>{
    if(q && !(s.name.toLowerCase().includes(q) || (s.ticker||'').toLowerCase().includes(q))) return false;
    if(filter!=='all' && signal(s).key!==filter) return false;
    return true;
  });
  arr.sort((a,b)=>{
    if(sort==='name') return a.name.localeCompare(b.name);
    if(sort==='change') return (change(a)??999) - (change(b)??999);
    if(sort==='day') return (a.day??999) - (b.day??999);
    const ra=signal(a).rank, rb=signal(b).rank;
    if(ra!==rb) return ra-rb;
    return Math.abs(change(b)??0) - Math.abs(change(a)??0);
  });

  $('list').innerHTML = arr.map(s=>{
    const c = change(s), sg = signal(s), T = thrOf(s);
    let fill = '';
    if(c!=null){
      const v = Math.max(-T, Math.min(T, c)), w = Math.abs(v)/T*50, left = v<0 ? 50-w : 50;
      const col = sg.key==='buy'?'var(--green)':sg.key==='sell'?'var(--red)':sg.key==='watch'?'var(--yellow)':'var(--blue)';
      fill = `<div class="fill" style="left:${left}%;width:${w}%;background:${col}"></div>`;
    }
    const last = s.log && s.log.length ? s.log[s.log.length-1] : null;
    let warn = '';
    if(!s.ticker) warn = '⚠️ Kein Ticker – Kurs wird nicht automatisch geladen (Bearbeiten → Ticker eintragen).';
    else if(s.missing) warn = '⚠️ Ticker nicht gefunden – bitte prüfen.';
    else if(c!=null && Math.abs(c) > 40) warn = '⚠️ Riesige Abweichung – vermutlich falscher Ticker/Börse. Bitte prüfen.';
    return `
    <div class="card ${sg.key}">
      <div class="row">
        <div>
          <div class="name">${esc(s.name)}</div>
          <div class="ticker">${esc(s.ticker||'kein Ticker')}${s.thr?' · Schwelle ±'+pctTxt(s.thr)+' %':''}${s.note?' · '+esc(s.note):''}</div>
        </div>
        <div>
          <div class="price">${fmt(s.cur)} €</div>
          <div style="text-align:right"><span class="badge ${sg.key}">${sg.label}</span></div>
        </div>
      </div>
      <div class="meter"><div class="mid"></div>${fill}</div>
      <div class="meter-l"><span>−${pctTxt(T)} % kaufen</span><span>+${pctTxt(T)} % verkaufen</span></div>
      <div class="meta">
        <div>Seit Referenz: <b class="${cls(c)}">${fmtPct(c)}</b></div>
        <div>Heute: <b class="${cls(s.day)}">${fmtPct(s.day)}</b></div>
        <div>Referenz: <b>${fmt(s.ref)}</b></div>
        <div>Kauf bei ≤ <b class="up">${s.ref?fmt(s.ref*(1-T/100)):'–'}</b></div>
        <div></div>
        <div>Verkauf bei ≥ <b class="down">${s.ref?fmt(s.ref*(1+T/100)):'–'}</b></div>
      </div>
      ${warn?`<div class="warn">${warn}</div>`:''}
      <div class="actions">
        <button class="small" onclick="trade('${s.id}','Gekauft')">✅ Gekauft</button>
        <button class="small" onclick="trade('${s.id}','Verkauft')">💰 Verkauft</button>
        <button class="small ghost" onclick="editStock('${s.id}')">✏️ Bearbeiten</button>
      </div>
      ${last?`<div class="log">Letzte Aktion: ${last.type} zu ${fmt(last.price)} € am ${last.date}</div>`:''}
    </div>`;
  }).join('') || '<div class="empty">Keine Treffer.</div>';
}

function trade(id, type){
  const s = state.stocks.find(x=>x.id===id);
  const input = prompt(`${type}: zu welchem Kurs (€)? Wird die neue Referenz.`, s.cur!=null? String(s.cur).replace('.',',') : '');
  if(input===null) return;
  const price = parseFloat(input.replace(',','.'));
  if(isNaN(price)) return;
  s.ref = price;
  if(s.cur==null) s.cur = price;
  (s.log = s.log||[]).push({type, price, date:new Date().toLocaleDateString('de-DE')});
  save(); render();
}

let editingId = null;
function editStock(id){
  editingId = id;
  const s = id ? state.stocks.find(x=>x.id===id) : {name:'',ticker:'',ref:null,cur:null,thr:null,note:''};
  $('dlgTitle').textContent = id ? 'Aktie bearbeiten' : 'Aktie hinzufügen';
  $('fName').value = s.name; $('fTicker').value = s.ticker||'';
  $('fRef').value = s.ref ?? ''; $('fCur').value = s.cur ?? ''; $('fThr').value = s.thr ?? ''; $('fNote').value = s.note||'';
  $('btnDelete').style.display = id ? '' : 'none';
  $('dlgStock').showModal();
}
$('btnAdd').onclick = ()=>editStock(null);
$('btnSave').onclick = ()=>{
  const num = v => v==='' ? null : parseFloat(String(v).replace(',','.'));
  const data = {name:$('fName').value.trim()||'Ohne Name', ticker:$('fTicker').value.trim().toUpperCase(),
                ref:num($('fRef').value), cur:num($('fCur').value), thr:num($('fThr').value), note:$('fNote').value.trim()};
  if(editingId){ Object.assign(state.stocks.find(x=>x.id===editingId), data, {missing:false}); }
  else state.stocks.push({id:uid(), day:null, log:[], ...data});
  save(); render(); $('dlgStock').close();
  if(data.ticker) refresh(true);
};
$('btnDelete').onclick = ()=>{
  if(!confirm('Aktie wirklich löschen?')) return;
  state.stocks = state.stocks.filter(x=>x.id!==editingId);
  save(); render(); $('dlgStock').close();
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

$('btnSettings').onclick = ()=>{
  $('sThreshold').value = String(state.threshold);
  $('sWatch').value = String(state.watch);
  $('sJson').value = JSON.stringify(state.stocks.map(({id,day,cur,missing,...r})=>r), null, 1);
  $('dlgSettings').showModal();
};
$('btnSaveSettings').onclick = ()=>{
  state.threshold = parseFloat($('sThreshold').value);
  state.watch = parseFloat($('sWatch').value);
  save(); render(); $('dlgSettings').close();
};
$('btnImport').onclick = ()=>{
  try{
    const arr = JSON.parse($('sJson').value);
    if(!Array.isArray(arr)) throw 0;
    state.stocks = arr.map(r=>({id:uid(), name:r.name||'?', ticker:(r.ticker||'').toUpperCase(),
      ref:r.ref??null, cur:r.ref??null, day:null, thr:r.thr??null, note:r.note||'', log:r.log||[]}));
    save(); render(); $('dlgSettings').close(); refresh(true);
  }catch(e){ alert('Ungültiges JSON'); }
};
$('btnReset').onclick = async ()=>{
  if(!confirm('Liste auf Standard zurücksetzen? Deine Referenzkurse & Trades gehen verloren.')) return;
  state.stocks = await defaultList(); save(); render(); $('dlgSettings').close(); refresh(true);
};
$('sortSel').onchange = render;

// Kurse kommen aus prices.json – wird von der GitHub Action alle 15 Min. aktualisiert
async function refresh(silent){
  if(!silent) $('status').textContent = 'Lade Kurse …';
  try{
    const r = await fetch('prices.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    let ok=0;
    for(const s of state.stocks){
      if(!s.ticker) continue;
      const p = data.prices[s.ticker];
      if(p && p.eur){
        s.cur = p.eur; s.day = p.day; s.missing = false;
        if(s.ref==null) s.ref = p.eur;
        ok++;
      } else if((data.failed||[]).includes(s.ticker)) s.missing = true;
    }
    state.updated = data.updated;
    save(); render();
    const t = new Date(data.updated);
    $('status').textContent = `Kurse vom ${t.toLocaleDateString('de-DE')} ${t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} · ${ok} von ${state.stocks.length} automatisch`;
  }catch(e){
    $('status').textContent = 'Noch keine Live-Kurse verfügbar (prices.json fehlt – läuft die GitHub Action?). Angezeigt: Kurse vom 24.11.';
  }
}
$('btnRefresh').onclick = ()=>refresh(false);

init();
</script>
</body>
</html>
